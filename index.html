<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>net_tools</title>
<meta name="description" content="Network tools that run entirely in your browser: DNS lookup, subnet calculator, email security check, WHOIS and IP info.">
<script>try{var t=localStorage.getItem("site-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/net-tools/net-tools.css">
</head>
<body class="nt-page">
<header data-nt-shell></header>
<main data-nt-tool="hub"></main>
<script src="assets/net-tools/nt-core.js"></script>
<script>
NT.register("hub", function (root) {
  root.innerHTML = NT.hero("Network engineering", "Network tools",
    "Everyday lookups and calculators for network engineers. Everything runs in your browser: there is no server, and nothing you type is stored.") +
    '<div class="nt-hub">' + NT.TOOLS.map(function (t) {
      return '<a href="' + NT.link(t.id) + '"><span class="k">/' + t.path.replace(/\/$/, "") + '</span><h2>' + t.name + '</h2><p>' + t.blurb + '</p></a>';
    }).join("") + '</div>';
});
</script>
</body>
</html>
