<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace }}">
    {% seo title=false %}
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ '/favicon-32x32.png' | relative_url }}" sizes="32x32" type="image/png">
    <link rel="icon" href="{{ '/favicon-16x16.png' | relative_url }}" sizes="16x16" type="image/png">
    <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
    <meta name="theme-color" content="#0f172a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!---->
    <link href="{{ '/pagefind/pagefind-ui.css' | relative_url }}" rel="stylesheet">

    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/net-tools-site.css' | relative_url }}">
    {%- if page.nt_tool %}
    <link rel="stylesheet" href="{{ '/assets/net-tools/net-tools.css' | relative_url }}">
    {%- endif %}
    <script defer src="{{ '/pagefind/pagefind-ui.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/search.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/copy-code.js' | relative_url }}"></script>
    {% include google-analytics.html %}
  </head>
  <body>
    <div class="reading-progress" data-reading-progress></div>
    {% include header.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
